<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="two-col tight"><section class="panel"><h3>नया ग्राहक / किसान जोड़ें</h3><form th:action="@{/customers}" method="post" class="stack-form"><label>Customer Name *<input name="name" required placeholder="किसान का नाम"></label><label>Phone<input name="phone" placeholder="मोबाइल नंबर"></label><label>Village<input name="village" placeholder="गाँव"></label><label>Address<input name="address" placeholder="पता"></label><button class="button" type="submit">+ Save Customer</button></form></section>
<section class="panel"><div class="panel-head"><h3>Customer Directory</h3><input class="search" placeholder="Search..." data-filter="customerTable"></div><div class="table-scroll"><table id="customerTable"><thead><tr><th>Name</th><th>Phone</th><th>Village</th><th>Details</th></tr></thead><tbody><tr th:each="c : ${customers}"><td th:text="${c.name}"></td><td th:text="${c.phone}"></td><td th:text="${c.village}"></td><td><a th:href="@{/customers/{id}(id=${c.id})}">View →</a></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="empty">No customers yet</td></tr></tbody></table></div></section></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
