<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="stats"><div class="stat-card"><span>कुल उधारी / बकाया</span><strong class="warn" th:text="'₹'+${totalDue}"></strong><small>Outstanding amount</small></div></div>
<div class="panel"><h3>बकाया वाले बिल</h3><div class="table-scroll"><table><thead><tr><th>Bill</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Receive Payment</th></tr></thead><tbody><tr th:each="s:${sales}" th:if="${s.due.signum()>0}"><td th:text="'INV-'+${s.id}"></td><td th:text="${s.customer.name}"></td><td th:text="'₹'+${s.total}"></td><td th:text="'₹'+${s.paid}"></td><td class="warn" th:text="'₹'+${s.due}"></td><td><a th:href="@{/sales/{id}(id=${s.id})}">Record payment →</a></td></tr></tbody></table></div></div>
<div class="panel"><h3>सभी भुगतान</h3><div class="table-scroll"><table><thead><tr><th>Date</th><th>Customer</th><th>Bill</th><th>Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${p.sale.customer.name}"></td><td><a th:href="@{/sales/{id}(id=${p.sale.id})}" th:text="'INV-'+${p.sale.id}"></a></td><td th:text="'₹'+${p.amount}"></td><td th:text="${p.method}"></td><td th:text="${p.reference}"></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="6" class="empty">No payments yet</td></tr></tbody></table></div></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
