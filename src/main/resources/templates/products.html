
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Products • Maurya Fertilizer Shop</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">

    <style>
        .product-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap;
        }

        .product-actions form {
            display: inline;
            margin: 0;
        }

        .product-edit {
            color: #00856a;
            font-weight: 600;
            text-decoration: none;
        }

        .product-delete {
            background: transparent;
            border: none;
            color: #d93025;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .product-delete:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="layout">

    <div th:replace="~{fragments :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments :: topbar}"></div>
        <div th:replace="~{fragments :: flash}"></div>

        <div class="page-actions">
            <div>
                <p class="muted">
                    Manage stock and pricing for fertilizer,
                    seeds, and other agricultural products.
                </p>
            </div>

            <a class="button" th:href="@{/products/new}">
                + Add New Product
            </a>
        </div>

        <div class="panel">

            <div class="panel-head">
                <h3>Product Inventory</h3>

                <input class="search"
                       placeholder="Search products..."
                       data-filter="productsTable">
            </div>

            <div class="table-scroll">

                <table id="productsTable">

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Barcode</th>
                            <th>Category</th>
                            <th>Unit</th>
                            <th>Purchase ₹</th>
                            <th>Sale ₹</th>
                            <th>Stock</th>
                            <th>Reorder Level</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="p : ${products}">

                            <td>
                                <strong th:text="${p.name}">
                                    Product Name
                                </strong>

                                <small class="block muted"
                                       th:text="${p.brand}">
                                    Brand
                                </small>
                            </td>

                            <td th:text="${p.barcode ?: '—'}">
                                —
                            </td>

                            <td th:text="${p.category}">
                                Fertilizer
                            </td>

                            <td th:text="${p.unit}">
                                Bag
                            </td>

                            <td th:text="${p.purchasePrice}">
                                0.00
                            </td>

                            <td th:text="${p.sellingPrice}">
                                0.00
                            </td>

                            <td>
                                <span class="pill"
                                      th:classappend="${p.stock <= p.reorderLevel} ? ' danger' : ''"
                                      th:text="${p.stock}">
                                    0
                                </span>
                            </td>

                            <td th:text="${p.reorderLevel}">
                                10
                            </td>

                            <!-- EDIT AND DELETE -->
                            <td>
                                <div class="product-actions">

                                    <a class="product-edit"
                                       th:href="@{/products/{id}/edit(id=${p.id})}">
                                        Edit
                                    </a>

                                    <form th:action="@{/products/{id}/delete(id=${p.id})}"
                                          method="post"
                                          onsubmit="return confirm('Are you sure you want to delete this product? Products with sales or purchase history should not be deleted.');">

                                        <button type="submit"
                                                class="product-delete">
                                            Delete
                                        </button>

                                    </form>

                                </div>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="9" class="empty">
                                No products yet. Add your first product.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>
