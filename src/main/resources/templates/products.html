<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="page-actions"><div><p class="muted">खाद, बीज और अन्य कृषि उत्पादों का stock और price manage करें।</p></div><a class="button" th:href="@{/products/new}">+ नया उत्पाद</a></div>
<div class="panel"><div class="panel-head"><h3>Product Inventory</h3><input class="search" placeholder="Search products..." data-filter="productsTable"></div><div class="table-scroll"><table id="productsTable"><thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Purchase ₹</th><th>Sale ₹</th><th>Stock</th><th>Reorder Level</th><th>Action</th></tr></thead><tbody>
<tr th:each="p : ${products}"><td><strong th:text="${p.name}"></strong><small class="block muted" th:text="${p.brand}"></small></td><td th:text="${p.category}"></td><td th:text="${p.unit}"></td><td th:text="${p.purchasePrice}"></td><td th:text="${p.sellingPrice}"></td><td><span class="pill" th:classappend="${p.stock <= p.reorderLevel} ? ' danger' : ''" th:text="${p.stock}"></span></td><td th:text="${p.reorderLevel}"></td><td><a th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="8" class="empty">कोई उत्पाद नहीं है, नया उत्पाद जोड़ें।</td></tr></tbody></table></div></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
