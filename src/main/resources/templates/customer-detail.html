<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer details • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="panel"><h3 th:text="${customer.name}"></h3><p class="muted"><span th:text="${customer.village}"></span> · <span th:text="${customer.phone}"></span> · <span th:text="${customer.address}"></span></p><h3>Customer Purchases / उधारी</h3><div class="table-scroll"><table><thead><tr><th>Bill</th><th>Product</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody><tr th:each="s : ${sales}"><td><a th:href="@{/sales/{id}(id=${s.id})}" th:text="'INV-'+${s.id}"></a></td><td th:text="${s.product.name}"></td><td th:text="${s.total}"></td><td th:text="${s.paid}"></td><td th:text="${s.due}"></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="5">No purchases yet</td></tr></tbody></table></div></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
