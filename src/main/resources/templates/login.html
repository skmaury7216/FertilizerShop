<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Maurya Fertilizer Shop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-body">

<div class="login-card">

    <div class="login-art">
        <div class="login-art-content">
            <div class="plant">🌾</div>
            <h1>Maurya Fertilizer Shop</h1>
            <p>Manage your fertilizer inventory, sales, customer accounts, and payments in one place.</p>

            <div class="login-tags">
                <span>Inventory</span>
                <span>Billing</span>
                <span>Payments</span>
            </div>
        </div>
    </div>

    <div class="login-form">
        <div class="eyebrow">SHOP MANAGER</div>
        <h2>Welcome Back!</h2>
        <p>Sign in with your shop administrator account.</p>

        <div th:if="${message}" class="alert success" th:text="${message}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="stack-form">
            <label>
                Username
                <input type="text" name="username" placeholder="Admin username" required>
            </label>

            <label>
                Password
                <input type="password" name="password" placeholder="Password" required>
            </label>

            <button class="button" type="submit">Sign In →</button>
        </form>

        <small>Administrator credentials are configured through environment variables.</small>
    </div>

</div>

</body>
</html>
