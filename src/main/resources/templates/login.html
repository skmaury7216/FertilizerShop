<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body class="login-body"><section class="login-card"><div class="login-art"><div class="plant">🌾</div><h1>मौर्या खाद भंडार</h1><p>आपकी खाद दुकान का स्टॉक, बिक्री, उधारी और ग्राहकों का हिसाब — एक ही जगह।</p><div class="login-tags"><span>Inventory</span><span>Billing</span><span>Payments</span></div></div><div class="login-form"><div class="eyebrow">SHOP MANAGER</div><h2>Welcome Back!</h2><p>अपने shop admin account से login करें।</p><div th:if="${param.error}" class="alert error">Username या password गलत है।</div><div th:if="${param.logout}" class="alert success">Logout successful.</div><form th:action="@{/login}" method="post" class="stack-form"><label>Username<input name="username" placeholder="Admin username" autocomplete="username" required></label><label>Password<input type="password" name="password" placeholder="Password" autocomplete="current-password" required></label><button class="button" type="submit">Sign In →</button></form><small>Admin credentials environment variables से सेट होते हैं।</small></div></section></body></html>
