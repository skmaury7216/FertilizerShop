<!doctype html>
<html lang="hi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • मौर्या खाद भंडार</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-body">

<div class="login-card">

    <div class="login-art">
        <div class="login-art-content">
            <div class="plant">🌾</div>
            <h1>मौर्या खाद भंडार</h1>
            <p>आपकी खाद दुकान का स्टॉक, बिक्री, उधारी और ग्राहकों का हिसाब — एक ही जगह।</p>

            <div class="login-tags">
                <span>Inventory</span>
                <span>Billing</span>
                <span>Payments</span>
            </div>
        </div>
    </div>

    <div class="login-form">
        <div class="eyebrow">SHOP MANAGER</div>
        <h2>Welcome Back!</h2>
        <p>अपने shop admin account से login करें।</p>

        <div th:if="${message}" class="alert success" th:text="${message}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="stack-form">
            <label>
                Username
                <input type="text" name="username" placeholder="Admin username" required>
            </label>

            <label>
                Password
                <input type="password" name="password" placeholder="Password" required>
            </label>

            <button class="button" type="submit">Sign In →</button>
        </form>

        <small>Admin credentials environment variables से सेट होते हैं।</small>
    </div>

</div>

</body>
</html>
