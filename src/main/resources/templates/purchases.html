<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Purchases • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="panel"><h3>नई खरीद जोड़ें (Stock In)</h3><p class="muted">खरीद Save होने पर Stock अपने-आप बढ़ जाएगा।</p><form th:action="@{/purchases}" method="post" class="form-grid">
<label>Product *<select name="productId" required><option value="">Select product</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name}+' ('+${p.stock}+' available)'"></option></select></label>
<label>Supplier<select name="supplierId"><option value="">Not specified</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></label>
<label>Quantity *<input type="number" min="1" name="quantity" required></label><label>Unit Cost ₹ *<input type="number" min="0" step="0.01" name="unitCost" required></label>
<label>Bill / Reference<input name="reference" placeholder="Purchase invoice no."></label><div class="submit-cell"><button class="button" type="submit">+ Add Stock</button></div></form></div>
<div class="panel"><h3>Purchase History</h3><div class="table-scroll"><table><thead><tr><th>When</th><th>Product</th><th>Supplier</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th>Reference</th></tr></thead><tbody><tr th:each="v:${purchases}"><td th:text="${#temporals.format(v.purchasedAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${v.product.name}"></td><td th:text="${v.supplier != null ? v.supplier.name : '-'}"></td><td th:text="${v.quantity}"></td><td th:text="${v.unitCost}"></td><td th:text="${v.totalCost}"></td><td th:text="${v.reference}"></td></tr><tr th:if="${#lists.isEmpty(purchases)}"><td colspan="7" class="empty">No stock purchases yet</td></tr></tbody></table></div></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
