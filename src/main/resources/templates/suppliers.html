<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="two-col tight"><section class="panel"><h3>Supplier जोड़ें</h3><form th:action="@{/suppliers}" method="post" class="stack-form"><label>Supplier Name *<input name="name" required></label><label>Phone<input name="phone"></label><label>Address<input name="address"></label><button class="button" type="submit">+ Save Supplier</button></form></section><section class="panel"><h3>Supplier List</h3><div class="table-scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th></tr></thead><tbody><tr th:each="s : ${suppliers}"><td th:text="${s.name}"></td><td th:text="${s.phone}"></td><td th:text="${s.address}"></td></tr><tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="3" class="empty">No suppliers yet</td></tr></tbody></table></div></section></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
