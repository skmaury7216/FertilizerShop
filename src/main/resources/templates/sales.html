<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales & Bills • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="panel"><h3>नया बिल / बिक्री</h3><p class="muted">बिक्री से stock घटेगा। Partial या उधारी के लिए Paid Now कम रखें।</p><form th:action="@{/sales}" method="post" class="form-grid">
<label>Customer *<select name="customerId" required><option value="">Select customer</option><option th:each="c:${customers}" th:value="${c.id}" th:text="${c.name}+' · '+${c.village}"></option></select></label>
<label>Product *<select name="productId" id="sale-product" required><option value="">Select product</option><option th:each="p:${products}" th:value="${p.id}" th:attr="data-price=${p.sellingPrice}" th:text="${p.name}+' · Stock '+${p.stock}"></option></select></label>
<label>Quantity *<input type="number" min="1" name="quantity" id="sale-quantity" value="1" required></label>
<label>Unit Selling Price (₹) *<input type="number" min="0.01" step="0.01" name="unitPrice" id="sale-price" required></label>
<label>Paid Now (₹)<input type="number" min="0" step="0.01" name="advance" value="0"></label>
<label>Payment Method<select name="method"><option>Cash</option><option>UPI (verified offline)</option><option>Bank Transfer (verified offline)</option></select></label>
<label>Payment Reference<input name="reference" placeholder="Optional, after verification"></label><div class="submit-cell"><div class="mini-total">Bill Total: <strong id="sale-total">₹0.00</strong></div><button class="button" type="submit">Generate Bill</button></div></form></div>
<div class="panel"><div class="panel-head"><h3>Sales Register</h3><input class="search" data-filter="salesTable" placeholder="Search bills..."></div><div class="table-scroll"><table id="salesTable"><thead><tr><th>Bill No.</th><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th></tr></thead><tbody><tr th:each="s:${sales}"><td><a th:href="@{/sales/{id}(id=${s.id})}" th:text="'INV-'+${s.id}"></a></td><td th:text="${#temporals.format(s.createdAt,'dd MMM yyyy')}"></td><td th:text="${s.customer.name}"></td><td th:text="${s.product.name}"></td><td th:text="${s.quantity}"></td><td th:text="${s.total}"></td><td th:text="${s.paid}"></td><td class="warn" th:text="${s.due}"></td><td><span class="pill" th:text="${s.paymentStatus}"></span></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="9" class="empty">No bills yet</td></tr></tbody></table></div></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
