<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="sidebar" class="sidebar">
 <div class="logo"><span class="logo-mark">🌾</span><span>मौर्या खाद भंडार <small>FERTILIZER SHOP</small></span></div>
 <div class="sidebar-label">MAIN MENU</div>
 <a th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/dashboard}">▦ <span>Dashboard</span></a>
 <a th:classappend="${active == 'products'} ? ' active' : ''" th:href="@{/products}">◈ <span>Products / Stock</span></a>
 <a th:classappend="${active == 'sales'} ? ' active' : ''" th:href="@{/sales}">▤ <span>Sales & Bills</span></a>
 <a th:classappend="${active == 'purchases'} ? ' active' : ''" th:href="@{/purchases}">⊞ <span>Stock Purchase</span></a>
 <div class="sidebar-label">MANAGEMENT</div>
 <a th:classappend="${active == 'customers'} ? ' active' : ''" th:href="@{/customers}">♙ <span>Customers / किसान</span></a>
 <a th:classappend="${active == 'suppliers'} ? ' active' : ''" th:href="@{/suppliers}">▥ <span>Suppliers</span></a>
 <a th:classappend="${active == 'payments'} ? ' active' : ''" th:href="@{/payments}">₹ <span>Payments / उधारी</span></a>
 <a th:classappend="${active == 'reports'} ? ' active' : ''" th:href="@{/reports}">◫ <span>Reports</span></a>
 <div class="sidebar-bottom"><form th:action="@{/logout}" method="post"><button class="logout" type="submit">↪ Log out</button></form><small>Local shop management • v1.0</small></div>
</div>
<div th:fragment="topbar" class="topbar"><div><span class="eyebrow">मौर्या खाद भंडार / WORKSPACE</span><h1 th:text="${pageTitle}">Dashboard</h1></div><div class="topbar-right"><span class="today" id="today"></span><span class="avatar">MK</span></div></div>
<div th:fragment="flash" class="alerts"><div th:if="${message}" class="alert success" th:text="${message}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div></div>
</body></html>
