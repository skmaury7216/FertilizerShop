<!doctype html><html lang="hi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports • मौर्या खाद भंडार</title><link rel="stylesheet" th:href="@{/css/main.css}"></head><body><div class="layout"><div th:replace="~{fragments :: sidebar}"></div><main class="main"><div th:replace="~{fragments :: topbar}"></div><div th:replace="~{fragments :: flash}"></div>
<div class="stats four"><div class="stat-card"><span>Sales</span><strong th:text="'₹'+${totalSales}"></strong></div><div class="stat-card"><span>Collected</span><strong th:text="'₹'+${totalPaid}"></strong></div><div class="stat-card"><span>Outstanding</span><strong class="warn" th:text="'₹'+${totalDue}"></strong></div><div class="stat-card"><span>Inventory Cost Value</span><strong th:text="'₹'+${inventoryValue}"></strong></div></div>
<div class="panel"><div class="panel-head"><h3>Stock Report</h3><button class="button light" onclick="window.print()">Print</button></div><div class="table-scroll"><table><thead><tr><th>Product</th><th>Stock</th><th>Reorder Level</th><th>Purchase Price</th><th>Selling Price</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.name}"></td><td th:text="${p.stock}"></td><td th:text="${p.reorderLevel}"></td><td th:text="${p.purchasePrice}"></td><td th:text="${p.sellingPrice}"></td></tr></tbody></table></div></div>
<div class="panel"><h3>Sales Summary</h3><div class="table-scroll"><table><thead><tr><th>Bill</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody><tr th:each="s:${sales}"><td th:text="'INV-'+${s.id}"></td><td th:text="${s.customer.name}"></td><td th:text="${s.total}"></td><td th:text="${s.paid}"></td><td th:text="${s.due}"></td></tr></tbody></table></div><p class="note">यह gross sales रिपोर्ट है; टैक्स, लागत और मुनाफा की लेखा गणना अलग से आवश्यक है।</p></div>
</main></div><script th:src="@{/js/main.js}"></script></body></html>
