
# =====================================
# Maurya Khad Bhandar - FertilizerShop
# Spring Boot Application Configuration
# =====================================

# Application
spring.application.name=Fertilizer Shop Manager
server.port=${PORT:8080}

# =====================================
# MySQL Database Configuration
# =====================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/fertilizershop_db}
spring.datasource.username=${DB_USER:fertilizershop_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# Hibernate / Spring Data JPA
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =====================================
# H2 Console Disabled
# =====================================
spring.h2.console.enabled=false

# =====================================
# Thymeleaf
# =====================================
spring.thymeleaf.cache=false

# =====================================
# Session Security
# =====================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# =====================================
# Shop Admin Login
# =====================================
shop.admin.username=${SHOP_ADMIN_USER:}
shop.admin.password=${SHOP_ADMIN_PASSWORD:}
