spring.application.name=Fertilizer Shop Manager
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fertilizershop;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
shop.admin.username=${SHOP_ADMIN_USER:}
shop.admin.password=${SHOP_ADMIN_PASSWORD:}
